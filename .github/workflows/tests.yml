name: Python and platform regression tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Offline regression tests
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, '-B', 'tools/run_tests.py'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          sys.stdout.write(result.stdout)
          if result.returncode:
              details = result.stdout[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + details)
          raise SystemExit(result.returncode)
          PY
      - name: Shell syntax
        if: runner.os != 'Windows'
        run: sh -n setup.sh
