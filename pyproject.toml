[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssm-spiceconex"
version = "0.4.2-dev"
description = "AWS desktop utility for cloud engineers"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7",
  "boto3>=1.39.0",
  "botocore>=1.39.0",
  "matplotlib>=3.10.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "Pillow>=11.3.0",
  "packaging>=25.0",
]

